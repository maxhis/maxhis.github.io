      <rect x="330" y="303" width="40" height="22" rx="11" transform="rotate(-8 330 303)" fill="#3B82F6" fill-opacity="0.92"/>
      <rect x="330" y="344" width="128" height="16" rx="8" transform="rotate(-8 330 344)" fill="#99B9EA"/>
      <rect x="330" y="382" width="152" height="16" rx="8" transform="rotate(-8 330 382)" fill="#B4CDEF"/>

      <rect x="418" y="222" width="212" height="284" rx="34" transform="rotate(6 418 222)" fill="url(#cardPurple)"/>
      <rect x="465" y="260" width="40" height="22" rx="11" transform="rotate(6 465 260)" fill="#7C5CFF" fill-opacity="0.9"/>
      <rect x="456" y="312" width="134" height="16" rx="8" transform="rotate(6 456 312)" fill="#B9A6EE"/>
      <rect x="452" y="352" width="160" height="16" rx="8" transform="rotate(6 452 352)" fill="#D0C2F7"/>

      <rect x="534" y="286" width="186" height="248" rx="32" transform="rotate(14 534 286)" fill="url(#cardOrange)"/>
      <rect x="592" y="326" width="38" height="21" rx="10.5" transform="rotate(14 592 326)" fill="#F97316" fill-opacity="0.92"/>
      <rect x="579" y="370" width="110" height="15" rx="7.5" transform="rotate(14 579 370)" fill="#E7B390"/>
      <rect x="569" y="406" width="132" height="15" rx="7.5" transform="rotate(14 569 406)" fill="#F2C8A8"/>

      <rect x="418" y="366" width="228" height="182" rx="28" fill="url(#cardGreen)"/>
      <rect x="450" y="402" width="38" height="21" rx="10.5" fill="#10B981" fill-opacity="0.9"/>
      <rect x="450" y="447" width="148" height="15" rx="7.5" fill="#A3DCC8"/>
      <rect x="450" y="482" width="112" height="15" rx="7.5" fill="#BEE9D8"/>
    </g>

    <g filter="url(#shadowLarge)">
      <path d="M288 358C288 336.461 305.461 319 327 319H455.229C469.502 319 483.026 325.386 492.135 336.399L532.634 385.37C539.67 393.879 550.13 398.81 561.174 398.81H697C718.539 398.81 736 416.271 736 437.81V486H288V358Z" fill="url(#folderTab)"/>
      <path d="M250 468C250 441.49 271.49 420 298 420H726C752.51 420 774 441.49 774 468V675C774 736.856 723.856 787 662 787H362C300.144 787 250 736.856 250 675V468Z" fill="url(#folderBody)"/>
      <path d="M250 468C250 441.49 271.49 420 298 420H726C752.51 420 774 441.49 774 468V484H250V468Z" fill="url(#folderLip)"/>
      <path d="M306 548C306 524.804 324.804 506 348 506H676C699.196 506 718 524.804 718 548V651C718 674.196 699.196 693 676 693H348C324.804 693 306 674.196 306 651V548Z" fill="#FFF8E9" fill-opacity="0.38"/>
      <path d="M306 548C306 524.804 324.804 506 348 506H676C699.196 506 718 524.804 718 548" stroke="white" stroke-opacity="0.48" stroke-width="10" stroke-linecap="round"/>
      <text x="374" y="648" font-family="Arial, 'PingFang SC', sans-serif" font-size="124" font-weight="800" fill="#C98A31" fill-opacity="0.58" stroke="white" stroke-opacity="0.18" stroke-width="5" paint-order="stroke">¥</text>
      <text x="562" y="646" font-family="Arial, 'PingFang SC', sans-serif" font-size="112" font-weight="800" fill="#C98A31" fill-opacity="0.54" stroke="white" stroke-opacity="0.16" stroke-width="5" paint-order="stroke">$</text>
