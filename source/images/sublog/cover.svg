      <stop offset="1" stop-color="#F4BF62"/>
    </linearGradient>
    <linearGradient id="folderBody" x1="260" y1="390" x2="737" y2="786" gradientUnits="userSpaceOnUse">
      <stop stop-color="#FFF4D7"/>
