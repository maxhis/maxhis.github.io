  <text x="80" y="290" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="28" font-weight="500" fill="white" fill-opacity="0.65">SubLog · 订阅管理小程序</text>

  <text x="80" y="370" font-family="'PingFang SC', 'Noto Sans SC', 'Microsoft YaHei', sans-serif" font-size="22" fill="white" fill-opacity="0.45">随用随开 · 用完即走 · 数据云同步</text>

  <!-- Feature pills -->
  <rect x="80" y="410" width="108" height="36" rx="18" fill="white" fill-opacity="0.1"/>
  <text x="134" y="434" text-anchor="middle" font-family="'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" fill="white" fill-opacity="0.7">支出概览</text>

  <rect x="200" y="410" width="108" height="36" rx="18" fill="white" fill-opacity="0.1"/>
  <text x="254" y="434" text-anchor="middle" font-family="'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" fill="white" fill-opacity="0.7">多币种</text>

  <rect x="320" y="410" width="108" height="36" rx="18" fill="white" fill-opacity="0.1"/>
  <text x="374" y="434" text-anchor="middle" font-family="'PingFang SC', 'Noto Sans SC', sans-serif" font-size="15" fill="white" fill-opacity="0.7">到期提醒</text>

  <!-- Right: Illustration (scaled & repositioned from original) -->
  <g transform="translate(520 -50) scale(0.65)">
    <g filter="url(#shadowCard)">
